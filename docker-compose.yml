services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: belegflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?fehlt in .env}
      POSTGRES_DB: belegflow
    volumes:
      - datenbank:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belegflow"]
      interval: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      BELEGFLOW_DATENBANK_URL: postgresql+psycopg://belegflow:${POSTGRES_PASSWORD}@db:5432/belegflow
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - belege:/srv/daten/belege
    restart: unless-stopped
volumes:
  datenbank:
  belege:
